[project]
name = "h2yaml"
dynamic = ["version"]
requires-python = ">= 3.10"
dependencies = [
  "pyyaml",
  "libclang",
]

[project.scripts]
h2yaml = "h2yaml:main"

[tool.setuptools]
py-modules = ["h2yaml"]

[tool.setuptools.dynamic]
version = {attr = "h2yaml.__version__"}

[dependency-groups]
test = [
  "pytest",
  "pytest-icdiff",
  "pytest-cov",
  "deepdiff"
]
# type_enforced 2.12.1 rewrites the decorated function's __code__ in place with a
# shifted line table, so coverage mis-attributes every decorated body as unhit.
typing = ["type_enforced!=2.12.1 ; python_version >= '3.11'"]
typing-test = [{include-group = "typing"}, {include-group = "test"}]

[tool.coverage.run]
plugins = ["coverage_h2yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
