[project]
name = "h2yaml"
dynamic = ["version"]
requires-python = ">= 3.10"
dependencies = [
  "pyyaml",
  "libclang",
]

[project.scripts]
h2yaml = "h2yaml:main"

[tool.setuptools]
py-modules = ["h2yaml"]

[tool.setuptools.dynamic]
version = {attr = "h2yaml.__version__"}

[dependency-groups]
test = [
  "pytest",
  "pytest-icdiff",
  "pytest-cov",
  "deepdiff",
  # type_enforced 2.12.1 rewrites the decorated function's __code__ in place with
  # a shifted line table, so coverage mis-attributes every decorated body as
  # unhit. It requires >= 3.11, so the 3.10 CI job runs without it and exercises
  # the `except ModuleNotFoundError` fallback in h2yaml.py.
  "type_enforced!=2.12.1 ; python_version >= '3.11'",
]

[tool.coverage.run]
plugins = ["coverage_h2yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
